syntax = "proto3";
package dbservices;
option go_package = "./proto/dbservice";

service StoreUrlService {
  rpc WriteURLPair(CreateRequest) returns (CreateResponse);
}

service ReadUrlService {
  rpc GetLongURL(GetRequest) returns (GetResponse);
}

message CreateRequest {
    int64 short_url = 1;  
    string long_url = 2;
}

message CreateResponse {
    int64 short_url = 1;
}

message GetRequest {
  int64 short_url = 1;
}

message GetResponse {
  string long_url = 1;
}